[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl"
version = "0.1.0"
description = "FDX Horizon fraud DSL PoC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.37,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"horizon_dsl.templates" = ["*.j2"]
